
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///tasks.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = file

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = file
qualname =

[logger_sqlalchemy]
level = WARNING
handlers = file
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = file
qualname = alembic

[handler_file]
class = FileHandler
args = ('alembic.log', 'a')
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S